<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHP Mooring System</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Lucide React Icons (simple implementations)
        const AlertCircle = ({ className, size = 24 }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const X = ({ size = 24 }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
            >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        // Color calculation functions
        const getLineColorGrey = () => '#9CA3AF';
        const getBoxColor = () => '#BFDBFE';

        const getTensionColor = (tension) => {
            if (tension === null || tension === undefined) return '#6B7280';
            if (tension < 50) return '#10B981';
            if (tension < 150) return '#3B82F6';
            if (tension < 250) return '#F59E0B';
            return '#EF4444';
        };

        // Alarm Modal Component
        const AlarmModal = ({ onClose, onSendAlarm, hookName }) => {
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 shadow-xl max-w-md">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-semibold text-gray-900">Send Alarm</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600">
                                <X size={20} />
                            </button>
                        </div>
                        <p className="text-gray-700 mb-6">
                            Send alarm notification for hook: <span className="font-semibold">{hookName}</span>
                        </p>
                        <div className="flex gap-3 justify-end">
                            <button
                                onClick={onClose}
                                className="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50"
                            >
                                Cancel
                            </button>
                            <button
                                onClick={onSendAlarm}
                                className="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 flex items-center gap-2"
                            >
                                <AlertCircle size={18} />
                                Send Alarm
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Color Selection Modal Component
        const ColorSelectionModal = ({ onClose, onSelectColor, bollardName }) => {
            const colors = [
                { name: 'Recommended', value: 'recommended', color: getBoxColor() },
                { name: 'Green', value: 'green', color: '#10B981' },
                { name: 'Yellow', value: 'yellow', color: '#F59E0B' },
                { name: 'Red', value: 'red', color: '#EF4444' },
                { name: 'Black', value: 'black', color: '#1F2937' }
            ];

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 shadow-xl max-w-md">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-semibold text-gray-900">Select Color</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600">
                                <X size={20} />
                            </button>
                        </div>
                        <p className="text-gray-700 mb-4">
                            Choose color for: <span className="font-semibold">{bollardName}</span>
                        </p>
                        <div className="space-y-2">
                            {colors.map((colorOption) => (
                                <button
                                    key={colorOption.value}
                                    onClick={() => onSelectColor(colorOption.value)}
                                    className="w-full flex items-center gap-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
                                >
                                    <div
                                        className="w-8 h-8 rounded border border-gray-300"
                                        style={{ backgroundColor: colorOption.color }}
                                    />
                                    <span className="font-medium">{colorOption.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Individual Hook Line Component - Bird's Eye View
        const HookLine = ({ hook, bollardY, shipX, shipY, shipWidth, shipLength, onHookClick }) => {
            const lineColor = getLineColorGrey();
            const tensionColor = getTensionColor(hook.tension);

            // Start from bollard position (left side)
            const startX = 120;
            const startY = bollardY;

            // End at ship - position based on line type
            let endX = shipX;
            let endY = shipY;

            // Position lines based on type
            if (hook.line_type === 'HEAD') {
                endX = shipX + shipWidth * 0.3;
                endY = shipY + 20; // Front of ship
            } else if (hook.line_type === 'STERN') {
                endX = shipX + shipWidth * 0.3;
                endY = shipY + shipLength - 20; // Back of ship
            } else if (hook.line_type === 'BREAST') {
                endX = shipX;
                endY = startY; // Perpendicular to bollard
            } else if (hook.line_type === 'SPRING_FWD' || hook.line_type === 'SPRING_AFT') {
                endX = shipX + shipWidth * 0.2;
                endY = shipY + shipLength * 0.5; // Middle of ship
            } else {
                // Default position
                endX = shipX + shipWidth * 0.3;
                endY = startY;
            }

            return (
                <g>
                    {/* Tension label next to bollard */}
                    <text
                        x={startX - 10}
                        y={startY + 5}
                        textAnchor="end"
                        className="text-sm font-semibold"
                        fill={tensionColor}
                    >
                        {hook.tension?.toFixed(1) || 'N/A'}
                    </text>

                    {/* Mooring line */}
                    <line
                        x1={startX}
                        y1={startY}
                        x2={endX}
                        y2={endY}
                        stroke={lineColor}
                        strokeWidth="3"
                        className="cursor-pointer hover:opacity-75 transition-opacity"
                        onClick={() => onHookClick(hook)}
                        strokeDasharray={hook.is_active ? "0" : "5,5"}
                    />

                    {/* Hook label */}
                    <text
                        x={startX - 15}
                        y={startY + 20}
                        className="text-xs"
                        fill="#6B7280"
                        textAnchor="end"
                    >
                        {hook.name}
                    </text>
                </g>
            );
        };

        // Bird's Eye View - Individual View (shows all bollards with detailed hooks)
        const BirdsEyeIndividualView = ({ shipData, onHookClick }) => {
            const svgWidth = 1000;
            const svgHeight = 600;

            // Ship dimensions and position
            const shipWidth = 180;
            const shipLength = 450;
            const shipX = 350;
            const shipY = 75;

            // Dock/Berth area
            const dockX = 50;
            const dockY = 50;
            const dockWidth = 120;
            const dockHeight = 500;

            // Calculate bollard positions
            const bollardSpacing = dockHeight / (shipData.bollards.length + 1);

            return (
                <div className="bg-white rounded-lg shadow-md p-6">
                    <h2 className="text-xl font-semibold text-gray-900 mb-4">
                        Individual View - Birds Eye Perspective
                    </h2>
                    <p className="text-sm text-gray-600 mb-4">
                        Click on any mooring line to send an alarm
                    </p>

                    <svg width={svgWidth} height={svgHeight} className="border border-gray-200 rounded bg-blue-50">
                        {/* Water background */}
                        <rect x={0} y={0} width={svgWidth} height={svgHeight} fill="#DBEAFE" />

                        {/* Dock/Berth area */}
                        <rect
                            x={dockX}
                            y={dockY}
                            width={dockWidth}
                            height={dockHeight}
                            fill="#9CA3AF"
                            stroke="#6B7280"
                            strokeWidth="2"
                        />
                        <text x={dockX + 10} y={dockY - 10} className="text-sm font-semibold" fill="#374151">
                            DOCK
                        </text>

                        {/* Ship - boat shape from above */}
                        <g>
                            {/* Main hull - elongated oval/boat shape */}
                            <ellipse
                                cx={shipX + shipWidth / 2}
                                cy={shipY + shipLength / 2}
                                rx={shipWidth / 2}
                                ry={shipLength / 2}
                                fill="#60A5FA"
                                stroke="#3B82F6"
                                strokeWidth="3"
                                opacity="0.85"
                            />

                            {/* Bow (front) - pointed */}
                            <path
                                d={`M ${shipX + shipWidth / 2} ${shipY}
                                    L ${shipX + shipWidth * 0.2} ${shipY + 40}
                                    L ${shipX + shipWidth * 0.8} ${shipY + 40}
                                    Z`}
                                fill="#3B82F6"
                                opacity="0.9"
                            />

                            {/* Ship label */}
                            <text
                                x={shipX + shipWidth / 2}
                                y={shipY + shipLength / 2}
                                textAnchor="middle"
                                className="text-lg font-bold"
                                fill="white"
                            >
                                VESSEL
                            </text>

                            {/* Bow/Stern labels */}
                            <text
                                x={shipX + shipWidth / 2}
                                y={shipY + 20}
                                textAnchor="middle"
                                className="text-xs font-semibold"
                                fill="white"
                            >
                                BOW
                            </text>
                            <text
                                x={shipX + shipWidth / 2}
                                y={shipY + shipLength - 10}
                                textAnchor="middle"
                                className="text-xs font-semibold"
                                fill="white"
                            >
                                STERN
                            </text>
                        </g>

                        {/* Bollards and mooring lines */}
                        {shipData.bollards.map((bollard, bollardIndex) => {
                            const bollardY = dockY + (bollardIndex + 1) * bollardSpacing;
                            const bollardX = dockX + dockWidth;

                            return (
                                <g key={bollard.name}>
                                    {/* Bollard */}
                                    <circle
                                        cx={bollardX}
                                        cy={bollardY}
                                        r="8"
                                        fill="#374151"
                                        stroke="#1F2937"
                                        strokeWidth="2"
                                    />

                                    {/* Bollard label */}
                                    <text
                                        x={dockX + 10}
                                        y={bollardY + 5}
                                        className="text-xs font-semibold"
                                        fill="#1F2937"
                                    >
                                        {bollard.name}
                                    </text>

                                    {/* Mooring lines from this bollard */}
                                    {bollard.hooks.filter(h => h.is_active).map((hook, hookIndex) => {
                                        const lineY = bollardY + (hookIndex - bollard.hooks.filter(h => h.is_active).length / 2) * 25;
                                        return (
                                            <HookLine
                                                key={hook.name}
                                                hook={hook}
                                                bollardY={lineY}
                                                shipX={shipX}
                                                shipY={shipY}
                                                shipWidth={shipWidth}
                                                shipLength={shipLength}
                                                onHookClick={onHookClick}
                                            />
                                        );
                                    })}
                                </g>
                            );
                        })}
                    </svg>

                    {/* Legend */}
                    <div className="mt-4 flex flex-wrap gap-4 text-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 bg-green-500 rounded"></div>
                            <span>Low (&lt;50)</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 bg-blue-500 rounded"></div>
                            <span>Normal (50-150)</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 bg-orange-500 rounded"></div>
                            <span>Warning (150-250)</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 bg-red-500 rounded"></div>
                            <span>Critical (&gt;250)</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Bird's Eye View - Group View (shows all bollards with color indicators)
        const BirdsEyeGroupView = ({ shipData, selectedColors, onBollardClick }) => {
            const svgWidth = 1000;
            const svgHeight = 600;

            // Ship dimensions and position
            const shipWidth = 180;
            const shipLength = 450;
            const shipX = 400;
            const shipY = 75;

            // Dock/Berth area
            const dockX = 50;
            const dockY = 50;
            const dockWidth = 150;
            const dockHeight = 500;

            // Calculate bollard positions
            const bollardSpacing = dockHeight / (shipData.bollards.length + 1);

            const lineColor = getLineColorGrey();

            return (
                <div className="bg-white rounded-lg shadow-md p-6">
                    <h2 className="text-xl font-semibold text-gray-900 mb-4">
                        Group View - Birds Eye Perspective
                    </h2>
                    <p className="text-sm text-gray-600 mb-4">
                        Click on any bollard area to select a color indicator
                    </p>

                    <svg width={svgWidth} height={svgHeight} className="border border-gray-200 rounded bg-blue-50">
                        {/* Water background */}
                        <rect x={0} y={0} width={svgWidth} height={svgHeight} fill="#DBEAFE" />

                        {/* Dock/Berth area */}
                        <rect
                            x={dockX}
                            y={dockY}
                            width={dockWidth}
                            height={dockHeight}
                            fill="#9CA3AF"
                            stroke="#6B7280"
                            strokeWidth="2"
                        />
                        <text x={dockX + 10} y={dockY - 10} className="text-sm font-semibold" fill="#374151">
                            DOCK
                        </text>

                        {/* Ship - boat shape from above */}
                        <g>
                            {/* Main hull */}
                            <ellipse
                                cx={shipX + shipWidth / 2}
                                cy={shipY + shipLength / 2}
                                rx={shipWidth / 2}
                                ry={shipLength / 2}
                                fill="#60A5FA"
                                stroke="#3B82F6"
                                strokeWidth="3"
                                opacity="0.85"
                            />

                            {/* Bow (front) - pointed */}
                            <path
                                d={`M ${shipX + shipWidth / 2} ${shipY}
                                    L ${shipX + shipWidth * 0.2} ${shipY + 40}
                                    L ${shipX + shipWidth * 0.8} ${shipY + 40}
                                    Z`}
                                fill="#3B82F6"
                                opacity="0.9"
                            />

                            {/* Ship label */}
                            <text
                                x={shipX + shipWidth / 2}
                                y={shipY + shipLength / 2}
                                textAnchor="middle"
                                className="text-lg font-bold"
                                fill="white"
                            >
                                VESSEL
                            </text>

                            <text
                                x={shipX + shipWidth / 2}
                                y={shipY + 20}
                                textAnchor="middle"
                                className="text-xs font-semibold"
                                fill="white"
                            >
                                BOW
                            </text>
                            <text
                                x={shipX + shipWidth / 2}
                                y={shipY + shipLength - 10}
                                textAnchor="middle"
                                className="text-xs font-semibold"
                                fill="white"
                            >
                                STERN
                            </text>
                        </g>

                        {/* Bollards with color indicators and grouped lines */}
                        {shipData.bollards.map((bollard, bollardIndex) => {
                            const bollardY = dockY + (bollardIndex + 1) * bollardSpacing;
                            const bollardX = dockX + dockWidth;
                            const activeHooks = bollard.hooks.filter(h => h.is_active);

                            // Get color for this bollard
                            const boxColor = selectedColors[bollard.name] === 'recommended' || !selectedColors[bollard.name]
                                ? getBoxColor()
                                : selectedColors[bollard.name] === 'green'
                                ? '#10B981'
                                : selectedColors[bollard.name] === 'yellow'
                                ? '#F59E0B'
                                : selectedColors[bollard.name] === 'red'
                                ? '#EF4444'
                                : '#1F2937';

                            return (
                                <g key={bollard.name}>
                                    {/* Clickable area for bollard */}
                                    <rect
                                        x={dockX - 5}
                                        y={bollardY - 30}
                                        width={dockWidth + 15}
                                        height={60}
                                        fill="transparent"
                                        className="cursor-pointer hover:fill-gray-200 hover:fill-opacity-30"
                                        onClick={() => onBollardClick(bollard)}
                                    />

                                    {/* Total tension label (left side) */}
                                    <text
                                        x={dockX - 15}
                                        y={bollardY + 5}
                                        textAnchor="end"
                                        className="text-sm font-bold"
                                        fill={getTensionColor(bollard.total_tension)}
                                    >
                                        {bollard.total_tension.toFixed(1)}
                                    </text>

                                    {/* Color indicator boxes (next to tension) */}
                                    <g transform={`translate(${dockX - 50}, ${bollardY - (activeHooks.length * 7)})`}>
                                        {activeHooks.map((hook, idx) => (
                                            <rect
                                                key={idx}
                                                x={0}
                                                y={idx * 14}
                                                width={12}
                                                height={12}
                                                fill={boxColor}
                                                stroke="#9CA3AF"
                                                strokeWidth="1"
                                                rx={2}
                                            />
                                        ))}
                                    </g>

                                    {/* Bollard circle */}
                                    <circle
                                        cx={bollardX}
                                        cy={bollardY}
                                        r="8"
                                        fill="#374151"
                                        stroke="#1F2937"
                                        strokeWidth="2"
                                    />

                                    {/* Bollard label */}
                                    <text
                                        x={dockX + 10}
                                        y={bollardY + 5}
                                        className="text-xs font-semibold"
                                        fill="#1F2937"
                                    >
                                        {bollard.name}
                                    </text>

                                    {/* Grouped mooring lines */}
                                    {activeHooks.map((hook, hookIndex) => {
                                        const lineStartY = bollardY + (hookIndex - activeHooks.length / 2) * 15;

                                        // Line endpoint on ship
                                        let endX = shipX;
                                        let endY = shipY + shipLength / 2;

                                        if (hook.line_type === 'HEAD') {
                                            endY = shipY + shipLength * 0.2;
                                        } else if (hook.line_type === 'STERN') {
                                            endY = shipY + shipLength * 0.8;
                                        } else if (hook.line_type === 'BREAST') {
                                            endY = lineStartY;
                                        }

                                        return (
                                            <line
                                                key={hook.name}
                                                x1={bollardX}
                                                y1={lineStartY}
                                                x2={endX}
                                                y2={endY}
                                                stroke={lineColor}
                                                strokeWidth="2.5"
                                                opacity="0.7"
                                            />
                                        );
                                    })}
                                </g>
                            );
                        })}
                    </svg>

                    {/* Legend */}
                    <div className="mt-4 flex flex-wrap gap-4 text-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 bg-gray-300 rounded"></div>
                            <span>Grey lines = Mooring lines</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 border border-gray-400 rounded" style={{ backgroundColor: getBoxColor() }}></div>
                            <span>Color boxes = Status indicators (click bollard to change)</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const MooringSystemApp = () => {
            const [shipData, setShipData] = useState(null);
            const [viewMode, setViewMode] = useState('group');
            const [selectedHook, setSelectedHook] = useState(null);
            const [selectedBollard, setSelectedBollard] = useState(null);
            const [selectedColors, setSelectedColors] = useState({});
            const [ws, setWs] = useState(null);
            const [isConnected, setIsConnected] = useState(false);
            const [error, setError] = useState(null);

            // API Base URL - always use port 8000 for the backend
            const API_BASE_URL = `${window.location.protocol}//${window.location.hostname}:8000`;

            // Configure your ship ID here
            const SHIP_ID = '2579'; // Change this to match your vessel ID (e.g., '2579')

            useEffect(() => {
                const connectWebSocket = () => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.hostname}:8000/ws`;

                    const websocket = new WebSocket(wsUrl);

                    websocket.onopen = () => {
                        console.log('WebSocket connected');
                        setIsConnected(true);
                        setError(null);
                    };

                    websocket.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            fetchShipData();
                        } catch (err) {
                            console.error('Error parsing WebSocket message:', err);
                        }
                    };

                    websocket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        setError('WebSocket connection error');
                    };

                    websocket.onclose = () => {
                        console.log('WebSocket disconnected');
                        setIsConnected(false);
                        setTimeout(connectWebSocket, 3000);
                    };

                    setWs(websocket);
                };

                connectWebSocket();

                return () => {
                    if (ws) {
                        ws.close();
                    }
                };
            }, []);

            const fetchShipData = async () => {
                try {
                    console.log(`Fetching ship data from: ${API_BASE_URL}/ships/${SHIP_ID}`);
                    const response = await fetch(`${API_BASE_URL}/ships/${SHIP_ID}`);

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Ship data received:', data);
                        setShipData(data);
                    } else if (response.status === 404) {
                        setError(`Ship ID "${SHIP_ID}" not found. Please check the SHIP_ID configuration.`);
                        console.error(`Ship not found. Status: ${response.status}`);
                    } else {
                        setError(`Failed to fetch ship data. Status: ${response.status}`);
                        console.error(`Error response: ${response.status} ${response.statusText}`);
                    }
                } catch (err) {
                    console.error('Error fetching ship data:', err);
                    setError(`Failed to connect to backend at ${API_BASE_URL}. Is the backend running?`);
                }
            };

            useEffect(() => {
                fetchShipData();
            }, []);

            const handleHookClick = (hook) => {
                setSelectedHook(hook);
            };

            const handleBollardClick = (bollard) => {
                setSelectedBollard(bollard);
            };

            const sendAlarm = async () => {
                if (!selectedHook) return;

                try {
                    await fetch(`${API_BASE_URL}/alarm/webhook`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            hook: selectedHook.name,
                            tension: selectedHook.tension,
                            timestamp: new Date().toISOString()
                        })
                    });
                    alert('Alarm sent successfully!');
                    setSelectedHook(null);
                } catch (err) {
                    console.error('Error sending alarm:', err);
                    alert('Failed to send alarm');
                }
            };

            const handleColorSelect = (color) => {
                if (!selectedBollard) return;

                setSelectedColors(prev => ({
                    ...prev,
                    [selectedBollard.name]: color
                }));
                setSelectedBollard(null);
            };

            if (error) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="bg-white p-8 rounded-lg shadow-md">
                            <AlertCircle className="text-red-500 w-12 h-12 mx-auto mb-4" />
                            <h2 className="text-xl font-semibold text-gray-900 mb-2">Connection Error</h2>
                            <p className="text-gray-600">{error}</p>
                        </div>
                    </div>
                );
            }

            if (!shipData) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading mooring data...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">BHP Mooring System</h1>
                                    <p className="text-sm text-gray-600 mt-1">
                                        {shipData.ship.name} ({shipData.ship.vessel_id}) - {shipData.berth}
                                    </p>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="flex items-center gap-2">
                                        <div className={`w-3 h-3 rounded-full ${isConnected ? 'bg-green-500' : 'bg-red-500'}`} />
                                        <span className="text-sm text-gray-600">
                                            {isConnected ? 'Connected' : 'Disconnected'}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                        <div className="bg-white rounded-lg shadow-sm p-2 inline-flex gap-2">
                            <button
                                onClick={() => setViewMode('individual')}
                                className={`px-4 py-2 rounded-md font-medium transition-colors ${
                                    viewMode === 'individual'
                                        ? 'bg-blue-600 text-white'
                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                }`}
                            >
                                Individual View
                            </button>
                            <button
                                onClick={() => setViewMode('group')}
                                className={`px-4 py-2 rounded-md font-medium transition-colors ${
                                    viewMode === 'group'
                                        ? 'bg-blue-600 text-white'
                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                }`}
                            >
                                Group View
                            </button>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h2 className="text-lg font-semibold text-gray-900 mb-4">Statistics</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div>
                                    <p className="text-sm text-gray-600">Total Tension</p>
                                    <p className="text-2xl font-bold text-gray-900">{shipData.statistics.total_tension.toFixed(1)}</p>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-600">Active Bollards</p>
                                    <p className="text-2xl font-bold text-gray-900">
                                        {shipData.statistics.active_bollards}/{shipData.statistics.total_bollards}
                                    </p>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-600">Active Hooks</p>
                                    <p className="text-2xl font-bold text-gray-900">{shipData.statistics.active_hooks}</p>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-600">Orientation</p>
                                    <p className="text-2xl font-bold text-gray-900">{shipData.statistics.orientation_angle}°</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 pb-8">
                        {viewMode === 'individual' ? (
                            <BirdsEyeIndividualView
                                shipData={shipData}
                                onHookClick={handleHookClick}
                            />
                        ) : (
                            <BirdsEyeGroupView
                                shipData={shipData}
                                selectedColors={selectedColors}
                                onBollardClick={handleBollardClick}
                            />
                        )}
                    </div>

                    {selectedHook && (
                        <AlarmModal
                            hookName={selectedHook.name}
                            onClose={() => setSelectedHook(null)}
                            onSendAlarm={sendAlarm}
                        />
                    )}

                    {selectedBollard && (
                        <ColorSelectionModal
                            bollardName={selectedBollard.name}
                            onClose={() => setSelectedBollard(null)}
                            onSelectColor={handleColorSelect}
                        />
                    )}
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MooringSystemApp />);
    </script>
</body>
</html>
